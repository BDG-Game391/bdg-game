<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: #fff; margin-top: 20px; }
        .card { background: #2e2e2e; padding: 15px; display: inline-block; border-radius: 10px; width: 320px; margin: 10px; vertical-align: top; }
        .btn { padding: 8px 15px; font-size: 15px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #4CAF50; color: white; }
        .btn-cut { background: #f44336; color: white; }
        .btn-update { background: #00bcd4; color: white; width: 90%; }
        input { padding: 8px; margin: 5px; width: 85%; border-radius: 5px; border: 1px solid #444; background: #111; color: #fff; }
    </style>
</head>
<body>

    <!-- Game Control Card -->
    <div class="card">
        <h2>🛠️ Game Control</h2>
        <p>Timer: <span id="adminTimer" style="color: #ff9800; font-weight: bold;">30s</span></p>
        <button class="btn btn-add" onclick="forceResult('Big')">Force WIN: BIG</button><br>
        <button class="btn btn-cut" onclick="forceResult('Small')">Force WIN: SMALL</button>
    </div>

    <!-- Wallet Manager Card -->
    <div class="card">
        <h2>💰 Wallet Manager</h2>
        <input type="text" id="targetUser" placeholder="User Name"><br>
        <input type="number" id="targetAmount" placeholder="Amount (₹)"><br>
        <button class="btn btn-add" onclick="modifyWallet('add')">Add Money (+)</button>
        <button class="btn btn-cut" onclick="modifyWallet('cut')">Cut Money (-)</button>
    </div>

    <!-- UPI & QR Manager Card (New Dynamic Feature) -->
    <div class="card">
        <h2>🔄 Payment Settings</h2>
        <p style="font-size: 12px; color: #aaa;">Yahan se UPI ID ya QR badlein (Changes turant apply honge):</p>
        <input type="text" id="newUpiId" placeholder="New UPI ID (e.g. abc@paytm)"><br>
        <input type="text" id="newQrUrl" placeholder="QR Image URL (Link)"><br>
        <button class="btn btn-update" onclick="updateUpi()">Update UPI & QR</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('timerUpdate', (data) => {
            document.getElementById('adminTimer').innerText = data.countdown + 's';
        });

        function forceResult(resultType) {
            socket.emit('setAdminResult', { result: resultType });
            alert('Next round forced to: ' + resultType);
        }

        function modifyWallet(actionType) {
            let username = document.getElementById('targetUser'].value.trim();
            let amount = document.getElementById('targetAmount'].value;
            if (!username || !amount) return alert('Enter username and amount!');
            socket.emit('adminAction', { username, amount, action: actionType });
            alert(`Successfully ${actionType}ed ₹${amount} for ${username}`);
        }

        function updateUpi() {
            let upiId = document.getElementById('newUpiId').value.trim();
            let qrUrl = document.getElementById('newQrUrl').value.trim();
            if (!upiId || !qrUrl) return alert('Dono fields bharna zaroori hai!');
            
            socket.emit('updateUpiConfig', { upiId, qrUrl });
            alert('UPI and QR updated successfully across the platform!');
        }
    </script>
</body>
</html>
