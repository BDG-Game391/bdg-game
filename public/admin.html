<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: #fff; margin-top: 30px; }
        .card { background: #2e2e2e; padding: 20px; display: inline-block; border-radius: 10px; width: 350px; margin: 10px; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #4CAF50; color: white; }
        .btn-cut { background: #f44336; color: white; }
        input { padding: 8px; margin: 5px; width: 80%; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛠️ Game Control</h2>
        <p>Next Round Timer: <span id="adminTimer" style="color: #ff9800; font-weight: bold;">30s</span></p>
        <button class="btn btn-add" onclick="forceResult('Big')">Force WIN: BIG</button>
        <button class="btn btn-cut" onclick="forceResult('Small')">Force WIN: SMALL</button>
    </div>

    <div class="card">
        <h2>💰 Wallet Manager</h2>
        <input type="text" id="targetUser" placeholder="User Name"><br>
        <input type="number" id="targetAmount" placeholder="Amount (₹)"><br>
        <button class="btn btn-add" onclick="modifyWallet('add')">Add Money (+)</button>
        <button class="btn btn-cut" onclick="modifyWallet('cut')">Cut Money (-)</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        socket.on('timerUpdate', (data) => {
            document.getElementById('adminTimer').innerText = data.countdown + 's';
        });

        function forceResult(resultType) {
            socket.emit('setAdminResult', { result: resultType });
            alert('Next round forced to: ' + resultType);
        }

        function modifyWallet(actionType) {
            let username = document.getElementById('targetUser').value.trim();
            let amount = document.getElementById('targetAmount').value;

            if (!username || !amount) {
                alert('Please enter username and amount!');
                return;
            }

            socket.emit('adminAction', { username, amount, action: actionType });
            alert(`Successfully ${actionType}ed ₹${amount} for user ${username}`);
        }
    </script>
</body>
</html>
