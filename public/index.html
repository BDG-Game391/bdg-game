<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDG Game - Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 50px; }
        .card { background: #1e1e1e; padding: 20px; display: inline-block; border-radius: 10px; }
        .timer { font-size: 40px; color: #ff9800; font-weight: bold; margin: 20px 0; }
        .btn { padding: 10px 20px; font-size: 18px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-big { background: #4CAF50; color: white; }
        .btn-small { background: #f44336; color: white; }
        .result { font-size: 22px; margin-top: 20px; color: #00bcd4; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Big-Small Prediction Game</h2>
        <div class="timer" id="timerDisplay">30s</div>
        <div>
            <button class="btn btn-big" onclick="alert('Bet Placed!')">BET BIG</button>
            <button class="btn btn-small" onclick="alert('Bet Placed!')">BET SMALL</button>
        </div>
        <div class="result" id="resultDisplay">Waiting for next round...</div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('timerUpdate', (data) => {
            document.getElementById('timerDisplay').innerText = data.countdown + 's';
        });
        socket.on('roundResult', (data) => {
            document.getElementById('resultDisplay').innerText = 'Last Round Winner: ' + data.result;
        });
    </script>
</body>
</html>
