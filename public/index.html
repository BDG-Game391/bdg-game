<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDG Game - Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin-top: 30px; }
        .card { background: #1e1e1e; padding: 20px; display: inline-block; border-radius: 10px; width: 320px; margin: 10px; }
        .timer { font-size: 35px; color: #ff9800; font-weight: bold; margin: 15px 0; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-big { background: #4CAF50; color: white; }
        .btn-small { background: #f44336; color: white; }
        .btn-deposit { background: #00bcd4; color: white; width: 100%; margin-bottom: 10px; }
        .wallet { background: #333; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 18px; color: #00bcd4; }
        #depositModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 20px; border-radius: 10px; width: 300px; text-align: center; color: #fff; }
        .modal-content img { width: 180px; height: 180px; background: #fff; padding: 5px; border-radius: 5px; }
        input { padding: 8px; margin: 8px 0; width: 90%; border-radius: 5px; border: 1px solid #444; background: #111; color: #fff; }
    </style>
</head>
<body>

    <div class="card" id="loginBox">
        <h2>Login to Play</h2>
        <input type="text" id="usernameInput" placeholder="Enter your name"><br><br>
        <button class="btn btn-big" onclick="login()">Start Game</button>
    </div>

    <div class="card" id="gameBox" style="display: none;">
        <h2>BDG Game</h2>
        <div class="wallet">Balance: ₹<span id="userBalance">0</span></div>
        <button class="btn btn-deposit" onclick="openDeposit()">Deposit Money (UPI)</button>
        
        <div class="timer" id="timerDisplay">30s</div>
        <div>
            <button class="btn btn-big" onclick="placeBet('Big')">BET BIG</button>
            <button class="btn btn-small" onclick="placeBet('Small')">BET SMALL</button>
        </div>
        <div id="resultDisplay" style="margin-top: 15px; color: #ffeb3b;">Waiting for round...</div>
    </div>

    <div id="depositModal">
        <div class="modal-content">
            <h3>Scan & Pay</h3>
            <img id="displayQrImg" src="" alt="UPI QR Code"><br>
            <p>UPI ID: <b id="displayUpiText" style="color: #00bcd4;">Loading...</b></p>
            <hr style="border-color: #444;">
            <p style="font-size: 13px; color: #bbb;">Payment ke baad UTR / Transaction ID apne admin ko dein ya yahan note karein:</p>
            <input type="text" id="utrInput" placeholder="Enter UTR / Transaction ID"><br>
            <button class="btn btn-big" onclick="submitDeposit()">Submit</button>
            <button class="btn btn-small" onclick="closeDeposit()">Close</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';

        function login() {
            myUsername = document.getElementById('usernameInput').value.trim();
            if (!myUsername) return alert('Naam daalna zaroori hai!');
            socket.emit('loginUser', myUsername);
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('gameBox').style.display = 'inline-block';
        }

        function openDeposit() {
            document.getElementById('depositModal').style.display = 'flex';
        }

        function closeDeposit() {
            document.getElementById('depositModal').style.display = 'none';
        }

        function submitDeposit() {
            let utr = document.getElementById('utrInput').value.trim();
            if (!utr) return alert('Kripya UTR ID dalein!');
            alert('Request submitted! Admin check karke balance add kar dega.');
            closeDeposit();
        }

        socket.on('updateUpiSettings', (data) => {
            document.getElementById('displayUpiText').innerText = data.upiId || 'Not Set';
            document.getElementById('displayQrImg').src = data.qrUrl || '';
        });

        socket.on('balanceUpdate', (bal) => {
            document.getElementById('userBalance').innerText = bal;
        });

        socket.on('refreshBalance', (data) => {
            if (data.username === myUsername) {
                document.getElementById('userBalance').innerText = data.balance;
            }
        });

        socket.on('timerUpdate', (data) => {
            document.getElementById('timerDisplay').innerText = data.countdown + 's';
        });

        socket.on('roundResult', (data) => {
            document.getElementById('resultDisplay').innerText = 'Winner: ' + data.result;
        });

        function placeBet(type) {
            alert('Bet placed on ' + type);
        }
    </script>
</body>
</html>
