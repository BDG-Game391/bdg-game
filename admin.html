<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDG Game - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: #fff; margin-top: 50px; }
        .card { background: #2e2e2e; padding: 30px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .timer { font-size: 35px; color: #ff9800; font-weight: bold; margin: 15px 0; }
        .btn { padding: 12px 25px; font-size: 18px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-big { background: #4CAF50; color: white; }
        .btn-small { background: #f44336; color: white; }
        .status { font-size: 20px; margin-top: 20px; color: #00bcd4; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛠️ Admin Control Dashboard</h2>
        <p>Next Round Result Control</p>
        <div class="timer" id="adminTimer">30s</div>
        
        <div>
            <button class="btn btn-big" onclick="forceResult('Big')">Force WIN: BIG</button>
            <button class="btn btn-small" onclick="forceResult('Small')">Force WIN: SMALL</button>
        </div>

        <div class="status" id="statusMessage">Status: Normal (Random)</div>
    </div>

    <!-- Socket.io library -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // Timer sync karna
        socket.on('timerUpdate', (data) => {
            document.getElementById('adminTimer').innerText = data.countdown + 's';
        });

        // Admin button click function
        function forceResult(resultType) {
            socket.emit('setAdminResult', { result: resultType });
            document.getElementById('statusMessageinnerText = 'Next Round Forced Winner: ' + resultType;
            alert('Success! Next round will result in: ' + resultType);
        }
    </script>

</body>
</html>
